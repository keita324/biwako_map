<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>びわ湖大花火大会 混雑マップ生成ツール</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<header class="app-header">
  <h1>びわ湖大花火大会 混雑マップ生成ツール</h1>
  <p>各ブロックの混雑度（1〜5）を入力すると地図が色分けされます。地図上のブロックをタップしても切り替えられます。</p>
</header>

<main class="layout">

  <!-- ===================== 地図 ===================== -->
  <section class="map-pane">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
         font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">

      <defs>
        <!-- ヒートマップ用のぼかしフィルタとグラデーション（JSがレベル別に追加） -->
        <filter id="heat-blur" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="18"/>
        </filter>
        <linearGradient id="title-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0b1f4d"/>
          <stop offset="1" stop-color="#050f2b"/>
        </linearGradient>
        <linearGradient id="title-accent" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#e64545"/>
          <stop offset="1" stop-color="#e6a03c"/>
        </linearGradient>
        <clipPath id="title-clip">
          <rect x="20" y="18" width="668" height="112" rx="16"/>
        </clipPath>
      </defs>

      <!-- ベースマップ（OpenStreetMapデータから生成。JSが basemap.js の内容を挿入） -->
      <g id="basemap-container"></g>

      <!-- 地名ラベル -->
      <g id="labels">
        <text x="780" y="80" font-size="32" font-weight="700" fill="#3a6f93" letter-spacing="8">琵琶湖</text>
        <text x="520" y="372" font-size="20" font-weight="700" fill="#6a675e" text-anchor="middle">びわ湖ホール</text>
        <text x="878" y="330" font-size="17" font-weight="600" fill="#6a675e" text-anchor="middle">ピアザ淡海</text>
        <text x="250" y="548" font-size="17" font-weight="700" fill="#5b5850" transform="rotate(7 250 548)">なぎさ通り</text>
        <text x="1246" y="60" font-size="15" font-weight="700" fill="#3a6f93" text-anchor="middle" transform="rotate(74 1246 60)">河川</text>
      </g>

      <!-- 入口・本部の目印 -->
      <g id="badges" font-size="14" font-weight="700">
        <rect x="33" y="468" width="48" height="24" rx="5" fill="#c22525"/>
        <text x="57" y="485" fill="#ffffff" text-anchor="middle">入口</text>
        <rect x="762" y="242" width="48" height="24" rx="5" fill="#c22525"/>
        <text x="786" y="259" fill="#ffffff" text-anchor="middle">入口</text>
        <rect x="816" y="242" width="48" height="24" rx="5" fill="#33322e"/>
        <text x="840" y="259" fill="#ffffff" text-anchor="middle">本部</text>
      </g>

      <!-- ブロック（JSが生成） -->
      <g id="blocks-layer"></g>

      <!-- タイトルカード（紺青の夜空×公式ロゴ） -->
      <g id="title-card">
        <rect x="20" y="18" width="668" height="112" rx="16" fill="url(#title-grad)"/>
        <!-- 星のあしらい -->
        <g clip-path="url(#title-clip)" fill="#e6c35c" opacity="0.6">
          <circle cx="248" cy="38" r="1.5"/>
          <circle cx="628" cy="40" r="1.6"/>
          <circle cx="590" cy="112" r="1.3"/>
          <circle cx="660" cy="78" r="1.2"/>
          <circle cx="236" cy="112" r="1.2"/>
        </g>
        <!-- 金の内枠 -->
        <rect x="26" y="24" width="656" height="100" rx="12" fill="none" stroke="#c9a44a" stroke-opacity="0.55" stroke-width="1.2"/>
        <rect x="20" y="18" width="668" height="112" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
        <!-- 公式ロゴ（JSが logo.js のデータを挿入） -->
        <image id="logo-img" x="40" y="26" width="162" height="97" preserveAspectRatio="xMidYMid meet"/>
        <line x1="222" y1="40" x2="222" y2="108" stroke="#c9a44a" stroke-opacity="0.4" stroke-width="1"/>
        <text id="svg-title" x="455" y="60" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">なぎさ公園エリア内自由（西側）</text>
        <text id="svg-title2" x="455" y="96" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="6" text-anchor="middle">混雑マップ</text>
        <text id="svg-time" x="668" y="118" font-size="15" font-weight="700" fill="#e6c35c" letter-spacing="1" text-anchor="end"></text>
      </g>

      <!-- 凡例（JSが生成） -->
      <g id="legend-layer"></g>

      <!-- 出典表記（OpenStreetMapのライセンス上必須。削除しないでください） -->
      <g>
        <rect x="1008" y="694" width="264" height="20" rx="4" fill="#ffffff" opacity="0.85"/>
        <text x="1264" y="708" font-size="13" fill="#52514e" text-anchor="end">地図データ © OpenStreetMap contributors</text>
      </g>
    </svg>
  </section>

  <!-- ===================== 入力パネル ===================== -->
  <section class="control-pane">

    <div class="card">
      <h2>画像に表示する情報</h2>
      <label class="field">
        <span>タイトル（1行目）</span>
        <input type="text" id="input-title" value="なぎさ公園エリア内自由（西側）">
      </label>
      <label class="field">
        <span>タイトル（2行目・中央揃え）</span>
        <input type="text" id="input-title2" value="混雑マップ">
      </label>
      <label class="field">
        <span>時刻表示</span>
        <span class="field-row">
          <input type="text" id="input-time" placeholder="例：17:30 現在">
          <button type="button" id="btn-now" class="btn btn-small">現在時刻</button>
        </span>
      </label>
    </div>

    <div class="card">
      <h2>ブロックごとの混雑度</h2>
      <p class="hint">「−」は未入力（灰色）に戻します。</p>
      <div id="block-list"></div>
    </div>

    <div class="card actions">
      <button type="button" id="btn-export" class="btn btn-primary">画像（PNG）を保存</button>
      <button type="button" id="btn-reset" class="btn btn-danger">すべてリセット</button>
      <p class="hint">保存したPNGを公式サイトに貼り付けてください。入力内容はこの端末のブラウザに自動保存されます。</p>
    </div>

  </section>
</main>

<script src="basemap.js?v=7"></script>
<script src="logo.js?v=7"></script>
<script src="blocks.js?v=7"></script>
<script src="app.js?v=7"></script>
</body>
</html>

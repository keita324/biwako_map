<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>びわ湖大花火大会 混雑マップ生成ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>びわ湖大花火大会 混雑マップ生成ツール</h1>
  <p>各ブロックの混雑度（1〜5）を入力すると地図が色分けされます。地図上のブロックをタップしても切り替えられます。</p>
</header>

<main class="layout">

  <!-- ===================== 地図 ===================== -->
  <section class="map-pane">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"
         font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif">

      <!-- ベースマップ（OpenStreetMapデータから生成。JSが basemap.js の内容を挿入） -->
      <g id="basemap-container"></g>

      <!-- 地名ラベル -->
      <g id="labels">
        <text x="920" y="100" font-size="34" font-weight="700" fill="#3a6f93" letter-spacing="8">琵琶湖</text>
        <text x="566" y="408" font-size="17" font-weight="700" fill="#6a675e" text-anchor="middle">びわ湖ホール</text>
        <text x="741" y="380" font-size="13" font-weight="600" fill="#6a675e" text-anchor="middle">ピアザ淡海</text>
        <text x="400" y="512" font-size="16" font-weight="700" fill="#5b5850" transform="rotate(7 400 512)">なぎさ通り</text>
        <text x="392" y="262" font-size="15" font-weight="700" fill="#4b7a3a" text-anchor="middle">大津湖岸なぎさ公園（打出の森）</text>
        <text x="1056" y="128" font-size="15" font-weight="700" fill="#4b7a3a" text-anchor="middle" transform="rotate(-16 1056 128)">なぎさのプロムナード</text>
      </g>

      <!-- 入口・本部の目印 -->
      <g id="badges" font-size="14" font-weight="700">
        <rect x="288" y="448" width="48" height="24" rx="5" fill="#c22525"/>
        <text x="312" y="465" fill="#ffffff" text-anchor="middle">入口</text>
        <rect x="652" y="400" width="48" height="24" rx="5" fill="#c22525"/>
        <text x="676" y="417" fill="#ffffff" text-anchor="middle">入口</text>
        <rect x="706" y="400" width="48" height="24" rx="5" fill="#33322e"/>
        <text x="730" y="417" fill="#ffffff" text-anchor="middle">本部</text>
      </g>

      <!-- ブロック（JSが生成） -->
      <g id="blocks-layer"></g>

      <!-- タイトルカード -->
      <g>
        <rect x="16" y="14" width="520" height="74" rx="10" fill="#ffffff" opacity="0.94" stroke="#c3c2b7" stroke-width="1.5"/>
        <text id="svg-title" x="36" y="46" font-size="26" font-weight="800" fill="#0b0b0b">びわ湖大花火大会 混雑マップ</text>
        <text id="svg-time" x="36" y="76" font-size="20" font-weight="600" fill="#52514e">-- 現在</text>
      </g>

      <!-- 凡例（JSが生成） -->
      <g id="legend-layer"></g>

      <!-- 出典表記（OpenStreetMapのライセンス上必須。削除しないでください） -->
      <g>
        <rect x="1008" y="694" width="264" height="20" rx="4" fill="#ffffff" opacity="0.85"/>
        <text x="1264" y="708" font-size="13" fill="#52514e" text-anchor="end">地図データ © OpenStreetMap contributors</text>
      </g>
    </svg>
  </section>

  <!-- ===================== 入力パネル ===================== -->
  <section class="control-pane">

    <div class="card">
      <h2>画像に表示する情報</h2>
      <label class="field">
        <span>タイトル</span>
        <input type="text" id="input-title" value="びわ湖大花火大会 混雑マップ">
      </label>
      <label class="field">
        <span>時刻表示</span>
        <span class="field-row">
          <input type="text" id="input-time" placeholder="例：17:30 現在">
          <button type="button" id="btn-now" class="btn btn-small">現在時刻</button>
        </span>
      </label>
    </div>

    <div class="card">
      <h2>ブロックごとの混雑度</h2>
      <p class="hint">「−」は未入力（灰色）に戻します。</p>
      <div id="block-list"></div>
    </div>

    <div class="card actions">
      <button type="button" id="btn-export" class="btn btn-primary">画像（PNG）を保存</button>
      <button type="button" id="btn-reset" class="btn btn-danger">すべてリセット</button>
      <p class="hint">保存したPNGを公式サイトに貼り付けてください。入力内容はこの端末のブラウザに自動保存されます。</p>
    </div>

  </section>
</main>

<script src="basemap.js"></script>
<script src="blocks.js"></script>
<script src="app.js"></script>
</body>
</html>
